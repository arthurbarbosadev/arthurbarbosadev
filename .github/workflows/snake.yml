name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: arthurbarbosadev
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=00FFFF&color_dots=161B22,0E7490,06B6D4,22D3EE,67E8F9

      - name: Fix missing # in SVG hex colors
        run: |
          sed -i -E 's/(--c[a-z0-9]+:)([0-9A-Fa-f]{6,8})([,;}])/\1#\2\3/g' dist/github-snake-dark.svg
          echo "=== Verificando CSS ==="
          grep -oE ':root\{[^}]+\}' dist/github-snake-dark.svg | head -c 400

      - uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
